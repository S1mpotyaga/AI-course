name: Lab 02 Statistics and Prefix Sums

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: lab-02-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-solutions:
    name: Check notebook solutions

    if: >-
      contains(github.event.pull_request.head.ref, '-lab-02-') &&
      !contains(github.event.pull_request.head.ref, '/')

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check notebook solutions
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          import runpy
          import sys
          from pathlib import Path

          root = Path("lab-02-statistics-prefix-queries")
          notebook_path = root / "lesson_02_statistics_prefix_queries.ipynb"
          tests_path = root / "tests"

          if not notebook_path.exists():
              print(f"Notebook not found: {notebook_path}")
              raise SystemExit(1)

          if not tests_path.exists():
              print(f"Tests directory not found: {tests_path}")
              raise SystemExit(1)

          sys.path.insert(0, str(tests_path.resolve()))

          expected_functions = [
              "filter_by_mean_distance",
              "filter_by_std",
              "skewness_direction",
              "build_prefixes",
              "solve_mean_queries",
              "solve_variance_queries",
              "solve_stability_queries",
              "solve_alarm_queries",
              "solve_skewness_queries",
          ]

          checker_names = [
              "check_0a_mean_filter.py",
              "check_0b_std_filter.py",
              "check_0c_skewness_direction.py",
              "check_prefixes.py",
              "check_a_mean.py",
              "check_b_variance.py",
              "check_c_stability.py",
              "check_d_alarm.py",
              "check_e_skewness.py",
          ]

          notebook = json.loads(
              notebook_path.read_text(encoding="utf-8")
          )

          namespace = {
              "__name__": "__notebook__",
          }

          expected_set = set(expected_functions)
          definition_sources = []

          # Находим ячейки с нужными функциями.
          for cell in notebook["cells"]:
              if cell.get("cell_type") != "code":
                  continue

              source = "".join(cell.get("source", []))

              try:
                  tree = ast.parse(source)
              except SyntaxError:
                  continue

              names = {
                  node.name
                  for node in ast.walk(tree)
                  if isinstance(
                      node,
                      (ast.FunctionDef, ast.AsyncFunctionDef),
                  )
              }

              if names & expected_set:
                  definition_sources.append(source)

          # Выполняем только определения функций.
          for source in definition_sources:
              exec(
                  compile(
                      source,
                      str(notebook_path),
                      "exec",
                  ),
                  namespace,
              )

          missing = [
              name
              for name in expected_functions
              if name not in namespace
          ]

          invalid = [
              name
              for name in expected_functions
              if name in namespace
              and not callable(namespace[name])
          ]

          unimplemented = []

          for source in definition_sources:
              tree = ast.parse(source)

              for node in ast.walk(tree):
                  if not isinstance(
                      node,
                      (ast.FunctionDef, ast.AsyncFunctionDef),
                  ):
                      continue

                  if node.name not in expected_set:
                      continue

                  function_source = (
                      ast.get_source_segment(source, node) or ""
                  )

                  if (
                      "TODO" in function_source
                      or "NotImplementedError" in function_source
                  ):
                      unimplemented.append(node.name)

          if missing or invalid or unimplemented:
              print(f"Missing functions: {missing}")
              print(f"Invalid functions: {invalid}")
              print(f"Unimplemented functions: {unimplemented}")
              raise SystemExit(1)

          passed = []
          failed = []

          for checker_name in checker_names:
              checker_path = tests_path / checker_name

              if not checker_path.exists():
                  failed.append(
                      (
                          checker_name,
                          "FileNotFoundError",
                          f"{checker_path} not found",
                      )
                  )
                  continue

              try:
                  runpy.run_path(
                      str(checker_path),
                      init_globals=namespace.copy(),
                  )
                  passed.append(checker_name)

              except Exception as error:
                  failed.append(
                      (
                          checker_name,
                          type(error).__name__,
                          str(error),
                      )
                  )

          print(
              f"Functions checked: "
              f"{len(expected_functions)}"
          )

          print(
              f"Checkers passed: "
              f"{len(passed)}/{len(checker_names)}"
          )

          if failed:
              print()

              for (
                  checker_name,
                  error_type,
                  message,
              ) in failed:
                  print(
                      f"FAILED {checker_name}: "
                      f"{error_type}: {message}"
                  )

              raise SystemExit(1)

          print("All notebook checkers passed.")
          PY