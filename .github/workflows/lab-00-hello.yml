name: Lab 00

on:
  push:
    branches:
      - '*-lab-00-*'
  pull_request:
    branches:
      - lab-00-hello
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-00-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-files:
    name: Check required files
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check required files
        shell: bash
        run: |
          required_files=(
            "./lab-00-hello/info.md"
            "./lab-00-hello/goals.md"
            "./lab-00-hello/commands.md"
            "./lab-00-hello/.gitignore"
            "./lab-00-hello/image/test.png"
          )

          errors=0
          printf '## Лабораторная 0\n\n| Файл | Результат |\n|---|---|\n' >> "$GITHUB_STEP_SUMMARY"

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" || -L "$file" ]]; then
              echo "::error file=$file::Файл отсутствует или не является обычным файлом: $file"
              printf '| `%s` | Не найден обычный файл |\n' "$file" >> "$GITHUB_STEP_SUMMARY"
              errors=$((errors + 1))
            # .gitignore может быть пустым после удаления правила image/test.png.
            elif [[ "$file" != ".gitignore" && ! -s "$file" ]]; then
              echo "::error file=$file::Файл пустой: $file"
              printf '| `%s` | Файл пустой |\n' "$file" >> "$GITHUB_STEP_SUMMARY"
              errors=$((errors + 1))
            else
              echo "OK: $file"
              printf '| `%s` | OK |\n' "$file" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [[ "$errors" -gt 0 ]]; then
            printf '\n**Проверка не пройдена. Ошибок: %s.**\n' "$errors" >> "$GITHUB_STEP_SUMMARY"
            echo "Исправьте ошибки, сделайте commit и push в ту же ветку."
            exit 1
          fi

          printf '\n**Все пять файлов найдены. Проверка пройдена.**\n' >> "$GITHUB_STEP_SUMMARY"
          echo "Все пять файлов найдены. Проверка пройдена."
